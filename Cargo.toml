[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/Zeitgleich/CalCraftApp"
homepage = "https://github.com/Zeitgleich/CalCraftApp"
authors = ["CalCraft contributors"]
publish = false
# License: to be decided (MPL-2.0 or MIT/Apache-2.0), see README.md.

[workspace.dependencies]
quick-xml = "0.42.0"
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

# Default transport (feature `hyper-transport`).
bytes = "1.11.1"
http = "1.4.0"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "ring", "tls12"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.54.0", default-features = false, features = ["rt", "time"] }
webpki-roots = "1.0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
overflow-checks = true
