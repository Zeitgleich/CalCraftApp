# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Every ignored advisory needs a reason and an issue link.
ignore = []

[licenses]
confidence-threshold = 0.93
# The app's own license is not decided yet (MPL-2.0 or MIT/Apache-2.0, see
# README.md). Workspace crates are `publish = false` and carry no license
# field, so they are ignored here; only third-party licenses are checked.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
